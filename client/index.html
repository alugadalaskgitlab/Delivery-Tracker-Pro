<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <meta property="og:title" content="DispatchPro" />
    <meta property="og:description" content="Dispatch management for material/mix deliveries with delivery challans, live status updates, and site acknowledgements." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://replit.com/public/images/opengraph.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@replit" />
    <meta name="twitter:title" content="DispatchPro" />
    <meta name="twitter:description" content="Dispatch management for material/mix deliveries with delivery challans, live status updates, and site acknowledgements." />
    <meta name="twitter:image" content="https://replit.com/public/images/opengraph.png" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" id="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" id="manifest-link" href="/manifest.json" />
    <meta name="theme-color" id="theme-color" content="#2B3E5C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DispatchPro" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital,opsz,wght@0,8..60,400;1,8..60,400&family=Inter:ital,opsz,wght@0,14..32,300..900;1,14..32,300..900&display=swap" rel="stylesheet" />
    <script>
      (function() {
        var path = window.location.pathname;
        var isSitePage = path && (path.indexOf('/site/') === 0 || path === '/site');
        if (path && path !== '/') {
          var iconPrefix = isSitePage ? '/site-icon' : '/icon';
          var themeColor = isSitePage ? '#2E7D32' : '#2B3E5C';
          var shortName = isSitePage ? 'DP Site' : 'DispatchPro';
          var manifest = {
            name: isSitePage ? 'DispatchPro Site' : 'DispatchPro - Highlane Constructions',
            short_name: shortName,
            description: 'Dispatch Management System for material and mix deliveries',
            start_url: path,
            scope: '/',
            display: 'standalone',
            background_color: themeColor,
            theme_color: themeColor,
            orientation: 'portrait-primary',
            icons: [
              { src: iconPrefix + '-192.png', sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
              { src: iconPrefix + '-512.png', sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
            ]
          };
          var blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
          var link = document.getElementById('manifest-link');
          if (link) link.href = URL.createObjectURL(blob);
          if (isSitePage) {
            var appleIcon = document.getElementById('apple-touch-icon');
            if (appleIcon) appleIcon.href = '/site-icon-192.png';
            var themeTag = document.getElementById('theme-color');
            if (themeTag) themeTag.content = themeColor;
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
